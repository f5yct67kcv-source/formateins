<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Playfair Display";src:url("file:///home/user/formateins/schriften/playfair-display.woff2") format("woff2");font-weight:400 900}
@font-face{font-family:"Schibsted Grotesk";src:url("file:///home/user/formateins/schriften/schibsted-grotesk.woff2") format("woff2");font-weight:400 900}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#05080b}
#bg{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 62%,#14202a 0%,#0a1016 55%,#040608 100%)}
#cone{position:absolute;left:50%;top:-80px;width:1100px;height:1500px;transform:translateX(-50%);
  background:radial-gradient(50% 100% at 50% 0%,rgba(255,226,190,.32) 0%,rgba(255,214,170,.10) 45%,rgba(255,214,170,0) 75%);
  clip-path:polygon(42% 0,58% 0,92% 100%,8% 100%);filter:blur(18px)}
#dust{position:absolute;inset:0}
#dose{position:absolute;left:50%;top:430px;width:560px;transform:translateX(-50%)}
#shadow{position:absolute;left:50%;top:1140px;width:520px;height:70px;transform:translateX(-50%);
  background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.7),rgba(0,0,0,0));filter:blur(8px)}
#name{position:absolute;top:1300px;width:100%;text-align:center;font:400 104px/1 "Playfair Display";color:#f2ede2;letter-spacing:.22em;text-indent:.22em}
#claim{position:absolute;top:1478px;width:100%;text-align:center;font:400 40px/1 "Schibsted Grotesk";color:#d9b48f;letter-spacing:.14em;text-indent:.14em}
#line{position:absolute;top:1438px;left:50%;height:2px;background:#c27c4e;transform:translateX(-50%)}
</style></head><body>
<div id="bg"></div><div id="cone"></div><canvas id="dust" width="1080" height="1920"></canvas>
<div id="shadow"></div><img id="dose" src="dose-a-900.png">
<div id="name">FULEHORN</div><div id="line"></div><div id="claim">Langsam geröstet.</div>
<script>
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3);
const seg=(t,a,b)=>ease((t-a)/(b-a));
let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
const P=[...Array(90)].map(()=>({x:390+rnd()*300,y:rnd()*1250,r:.8+rnd()*2.2,v:6+rnd()*14,a:.25+rnd()*.6,ph:rnd()*6.28}));
const cv=document.getElementById('dust'),cx=cv.getContext('2d');
window.render=function(t){
  const light=seg(t,0,1.4);
  document.getElementById('cone').style.opacity=.25+.75*light;
  const d=seg(t,0.1,1.5);
  const dose=document.getElementById('dose');
  dose.style.opacity=d;dose.style.transform=`translateX(-50%) translateY(${(1-d)*90}px) scale(${0.96+0.04*d+0.012*t})`;
  document.getElementById('shadow').style.opacity=d;
  const n=seg(t,1.0,2.0),nm=document.getElementById('name');
  nm.style.opacity=n;nm.style.letterSpacing=(0.36-0.14*n)+'em';
  const l=seg(t,1.4,2.2);document.getElementById('line').style.width=(l*240)+'px';
  const c=seg(t,1.7,2.5),cl=document.getElementById('claim');
  cl.style.opacity=c;cl.style.transform=`translateY(${(1-c)*18}px)`;
  cx.clearRect(0,0,1080,1920);
  for(const p of P){const y=(p.y+t*p.v)%1250,x=p.x+Math.sin(t*.6+p.ph)*12;
    const spread=(y/1250);const xx=540+(x-540)*(0.4+spread*1.6);
    cx.fillStyle=`rgba(255,226,190,${p.a*light*(0.5+0.5*Math.sin(t*1.3+p.ph))})`;
    cx.beginPath();cx.arc(xx,y,p.r,0,6.28);cx.fill();}
};
render(0);
</script></body></html>
