<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Playfair Display";src:url("file:///home/user/formateins/schriften/playfair-display.woff2") format("woff2");font-weight:400 900}
@font-face{font-family:"Schibsted Grotesk";src:url("file:///home/user/formateins/schriften/schibsted-grotesk.woff2") format("woff2");font-weight:400 900}
:root{--papier:#f2ede2;--signal:#ff8a4c;--tinte:#15202a}
html,body{margin:0;width:360px;height:640px;overflow:hidden;background:#0e161c;font-family:"Schibsted Grotesk"}
.layer{position:absolute;inset:0;transform-origin:50% 30%}
.pf{position:absolute;inset:0;background:var(--papier);color:var(--tinte);padding:26px 46px 0}
.top{display:flex;align-items:center;gap:14px}
.av{width:68px;height:68px;border-radius:50%;background:#e4ddcf url(img/dose.png) center/60% no-repeat;border:2px solid #d8cfbf;flex:none}
.nm{font:700 17px/1.2 "Schibsted Grotesk"}
.st{display:flex;gap:16px;font-size:11px;margin-top:5px;color:#4a5560}
.st b{color:var(--tinte);font-size:15px;display:block;font-variant-numeric:tabular-nums}
.badge{display:inline-block;margin-top:14px;font:700 11px/1 "Schibsted Grotesk";padding:5px 8px;border-radius:2px}
.old{color:#fff;background:var(--signal)}
.new{color:var(--tinte);background:#d6ead8}
.bio{font-size:12px;line-height:1.4;margin:10px 0 12px;color:#4a5560}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:0 -46px}
.grid>div{aspect-ratio:1;background:#d7d9d8 center/cover;position:relative}
.dull{background:#eceeee}.dull .top,.dull .bio,.dull .grid{filter:saturate(.15)}
.old{animation:none}
.dull .av{background:#d9dcdc;border-color:#cfd2d2}
.dull .grid>div{background:#d4d7d7}
#wipe{position:absolute;left:0;right:0;height:3px;background:var(--signal);box-shadow:0 0 14px 2px var(--signal);z-index:5}
#zoom{position:absolute;background:#000 center/cover;z-index:6;overflow:hidden}
.pl{position:absolute;right:5px;top:5px;color:#fff;font-size:10px;text-shadow:0 0 3px #000}
.txt{display:grid;place-items:center;text-align:center;color:#f2ede2;font:600 15px/1.2 "Playfair Display";background:#15202a!important}
</style></head><body>
<div class="layer" id="L">
 <div class="pf" id="after">
  <div class="top"><div class="av"></div><div><div class="nm">fulehorn</div>
   <div class="st"><span><b id="posts">9</b>Beiträge</span><span><b id="fol">37</b>Follower</span><span><b>48</b>Gefolgt</span></div></div></div>
  <div class="badge new" id="bnew">● neuer Beitrag vor 2 Std.</div>
  <div class="bio">Kaffeerösterei · Langsam geröstet.</div>
  <div class="grid" id="g"></div>
 </div>
 <div class="pf dull" id="before">
  <div class="top"><div class="av"></div><div><div class="nm">fulehorn</div>
   <div class="st"><span><b>9</b>Beiträge</span><span><b>37</b>Follower</span><span><b>48</b>Gefolgt</span></div></div></div>
  <div class="badge old">letzter Beitrag vor 8 Wochen</div>
  <div class="bio">Kaffeerösterei</div>
  <div class="grid"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
 </div>
</div>
<div id="wipe"></div>
<div id="zoom"></div>
<script>
const T=[["po",""],["plantage.jpg",""],["hero.jpg",""],["roesterei.jpg",""],["endkarte.jpg","50% 22%"],["deckel.jpg",""],
 ["tasse.jpg",""],["TXT","Ernte<br>2026"],["plantage.jpg","20% 85%"],["hero.jpg","50% 20%"],["pourover.jpg","70% 40%"],["roesterei.jpg","85% 60%"]];
const g=document.getElementById('g');
T.forEach(([s,p],i)=>{const d=document.createElement('div');
 if(s==="TXT"){d.className='txt';d.innerHTML=p}else if(s!=="po"){d.style.backgroundImage=`url(img/${s})`;if(p)d.style.backgroundPosition=p}
 g.appendChild(d)});
const tiles=[...g.children];tiles[0].innerHTML='<span class="pl">▶</span>';
const cl=(x)=>x<0?0:x>1?1:x, eo=t=>1-Math.pow(1-cl(t),3), eio=t=>{t=cl(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const fmt=n=>Math.round(n).toLocaleString('de-CH').replace(/[’,]/g,"'");
const po=i=>`po/p${String(Math.min(96,Math.max(1,i))).padStart(3,'0')}.jpg`;
window.render=function(t,f){
 const L=document.getElementById('L');
 const ob=document.querySelector('.old');ob.style.transform=`scale(${1+0.06*Math.max(0,Math.sin(t*5.2))*(t<1.2?1:0)})`;ob.style.transformOrigin='0 50%';
 L.style.transform=`scale(${1+0.025*cl(t/3.4)})`;
 // Wisch 1.2-1.7
 const w=eio((t-1.2)/0.5), y=w*660;
 document.getElementById('before').style.clipPath=`inset(${y}px 0 0 0)`;
 const wp=document.getElementById('wipe');wp.style.top=(y-2)+'px';wp.style.opacity=(t>1.15&&t<1.75)?1:0;
 // Kacheln gestaffelt
 tiles.forEach((d,i)=>{const k=eo((t-1.35-i*0.07)/0.35);d.style.opacity=k;d.style.transform=`scale(${0.86+0.14*k})`});
 // Zaehler
 const c=eo((t-1.6)/1.5);
 document.getElementById('fol').textContent=fmt(37+(2480-37)*c);
 document.getElementById('posts').textContent=Math.round(9+15*c);
 // laufende Kachel
 const pf=Math.round((t-1.4)*30)+1; tiles[0].style.backgroundImage=`url(${po(pf)})`;
 // Sprung 3.35-4.1
 const z=document.getElementById('zoom'), j=eio((t-3.35)/0.75);
 if(t<3.35){z.style.display='none';}else{
  const r=tiles[0].getBoundingClientRect();
  z.style.display='block';z.style.backgroundImage=`url(${po(pf)})`;
  z.style.left=r.left*(1-j)+'px';z.style.top=r.top*(1-j)+'px';
  z.style.width=r.width+(360-r.width)*j+'px';z.style.height=r.height+(640-r.height)*j+'px';
  L.style.filter=`brightness(${1-0.5*j})`;}
};
render(0);
</script></body></html>
