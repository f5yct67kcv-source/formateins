<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Reel-Test</title>
<style>
body{margin:0;padding:20px 16px 60px;background:#13202a;color:#e8ecef;font:16px/1.45 system-ui,sans-serif}
h1{font-size:1.3rem;margin:0 0 4px}
p{margin:.3em 0;color:#aeb8c0}
.zeile{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #2b3a45}
.zeile b{color:#fff}
.gut{color:#7fd88f}.schlecht{color:#ff8a6a}
.reihe{display:flex;gap:12px;margin-top:20px}
.reihe figure{margin:0;flex:1;text-align:center;font-size:.85rem;color:#aeb8c0}
.reihe video,.reihe img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:10px;background:#0a1219}
</style>
</head>
<body>
<h1>Reel-Test</h1>
<p>Bitte einmal so öffnen, wie du die Seite vorhin angeschaut hast, und mir ein Bildschirmfoto schicken.</p>
<div class="zeile"><span>Bewegung reduzieren</span><b id="bewegung">…</b></div>
<div class="zeile"><span>Video spielt von selbst</span><b id="video">…</b></div>
<div class="zeile"><span>Browser</span><b id="browser" style="font-weight:400;font-size:.8rem;text-align:right">…</b></div>
<div class="reihe">
  <figure><video id="v" muted loop playsinline preload="auto" poster="video-reel.jpg"><source src="video-reel-voll-ton.mp4" type="video/mp4"></video><figcaption>1 Video</figcaption></figure>
  <figure><img src="entwurf-reeltest.webp" alt=""><figcaption>2 Bewegtes Bild</figcaption></figure>
</div>
<p style="margin-top:14px">Bewegt sich 1, 2 oder beides?</p>
<script>
const $ = id => document.getElementById(id);
const r = matchMedia('(prefers-reduced-motion: reduce)').matches;
$('bewegung').textContent = r ? 'ein' : 'aus';
$('bewegung').className = r ? 'schlecht' : 'gut';
$('browser').textContent = navigator.userAgent.replace(/^Mozilla\/5\.0 /, '');
$('v').play().then(
  () => { $('video').textContent = 'ja'; $('video').className = 'gut'; },
  e => { $('video').textContent = 'nein (' + e.name + ')'; $('video').className = 'schlecht'; }
);
</script>
</body>
</html>
