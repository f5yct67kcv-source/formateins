name: Website zu Hostpoint

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nie zwei Uploads gleichzeitig, sonst kommt sich die Abgleichsdatei in die Quere.
concurrency:
  group: deploy-hostpoint
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP bereitstellen
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      # Kein Upload mit kaputter Syntax. Lokal laeuft kein PHP-Server.
      - name: Syntax pruefen
        run: |
          php -l anfrage.php
          php -l termine.php
          php -l kalender-zugang.php
          php -l betreiber-eingang.php
          node --check messung.js
          python3 -m py_compile quellen/indexnow.py

  deploy:
    needs: pruefen
    runs-on: ubuntu-latest
    steps:
      # Ganze Geschichte, damit IndexNow am Schluss sieht, welche Seiten sich
      # seit dem letzten Push geaendert haben.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Alles ausser dem, was nur ins Repository gehoert. Neue Dateien kommen
      # so von selbst mit, eintragen muss man hier nur Ausnahmen.
      - name: Auslieferung zusammenstellen
        run: |
          rsync -a \
            --exclude '.git/' --exclude '.github/' --exclude '.claude/' \
            --exclude '.gitignore' --exclude 'archiv/' --exclude 'quellen/' \
            --exclude 'README.md' --exclude 'CLAUDE.md' --exclude 'LOGBUCH.md' --exclude 'htaccess-hostpoint' --exclude 'dist/' \
            --exclude 'node_modules/' --exclude 'entwurf*' \
            ./ dist/
          cp htaccess-hostpoint dist/.htaccess
          find dist -type f | sort

      # Die Kommentare im Quelltext sind fuer das Repository geschrieben, nicht
      # fuer Besucher: wer die Seite im Browser als Quelltext oeffnet, soll den
      # Bau sehen und nicht die Notizen dazu. Im Repository bleiben sie stehen,
      # herausgenommen werden sie nur hier, in der Auslieferung. Das Skript
      # schneidet Zeichenbereiche heraus und schreibt nichts um; findet es
      # etwas, das es nicht sicher einordnen kann, bricht es ab und es wird
      # nichts hochgeladen.
      - name: Kommentare aus der Auslieferung nehmen
        run: |
          npm install --no-save --no-audit --no-fund --ignore-scripts acorn@8.14.0
          node quellen/kommentare-entfernen.mjs dist

      # Zugang zum Kalender ¬´Gespraeche¬ª fuer termine.php. Fehlen die Secrets,
      # bleiben die Platzhalter stehen und gespraech.html zeigt Telefon und Mail.
      - name: Kalenderzugang eintragen
        env:
          KALENDER_BENUTZER: ${{ secrets.KALENDER_BENUTZER }}
          KALENDER_PASSWORT: ${{ secrets.KALENDER_PASSWORT }}
        run: |
          python3 - <<'PY'
          import os
          pfad = 'dist/kalender-zugang.php'
          text = open(pfad, encoding='utf-8').read()
          php = lambda w: w.replace('\\', '\\\\').replace("'", "\\'")
          for name in ('KALENDER_BENUTZER', 'KALENDER_PASSWORT'):
              wert = os.environ.get(name, '')
              if wert:
                  text = text.replace('__' + name + '__', php(wert))
              else:
                  print(f'::warning::Secret {name} fehlt, Terminbuchung bleibt aus')
          open(pfad, 'w', encoding='utf-8').write(text)
          PY

      # Schluessel fuer den Eingang im Betreiber-Bereich (ENT-038), derselbe Wert
      # wie das Secret ANFRAGE_SCHLUESSEL in formateins-betreiber. Fehlt er,
      # gehen Anfragen und Gespraeche nur per Mail.
      - name: Schluessel fuer den Betreiber-Bereich eintragen
        env:
          ANFRAGE_SCHLUESSEL: ${{ secrets.ANFRAGE_SCHLUESSEL }}
        run: |
          python3 - <<'PY'
          import os
          pfad = 'dist/betreiber-eingang.php'
          wert = os.environ.get('ANFRAGE_SCHLUESSEL', '').strip()
          if wert:
              php = lambda w: w.replace('\\', '\\\\').replace("'", "\\'")
              text = open(pfad, encoding='utf-8').read()
              neu = text.replace("'__ANFRAGE_SCHLUESSEL__'", "'" + php(wert) + "'", 1)
              if neu == text: raise SystemExit('Platzhalter in betreiber-eingang.php nicht gefunden')
              open(pfad, 'w', encoding='utf-8').write(neu)
              print('eingetragen in', pfad)
          else:
              print('::warning::Secret ANFRAGE_SCHLUESSEL fehlt, Anfragen und Gespraeche kommen nur per Mail, nicht im Betreiber-Bereich')
          PY

      - name: Zugangsdaten vorhanden?
        env:
          HOST: ${{ secrets.HOSTPOINT_FTP_HOST }}
          BENUTZER: ${{ secrets.FORMATEINS_FTP_USER }}
          PASSWORT: ${{ secrets.FORMATEINS_FTP_PASSWORD }}
        run: |
          fehlt=""
          [ -z "$HOST" ] && fehlt="$fehlt HOSTPOINT_FTP_HOST"
          [ -z "$BENUTZER" ] && fehlt="$fehlt FORMATEINS_FTP_USER"
          [ -z "$PASSWORT" ] && fehlt="$fehlt FORMATEINS_FTP_PASSWORD"
          if [ -n "$fehlt" ]; then echo "Diese Secrets fehlen im Repository:$fehlt"; exit 1; fi

      - name: Nach Hostpoint hochladen (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTPOINT_FTP_HOST }}
          username: ${{ secrets.FORMATEINS_FTP_USER }}
          password: ${{ secrets.FORMATEINS_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          # Der FTP-Benutzer ist bei Hostpoint auf den Ordner von formateins.ch
          # eingeschraenkt, darum hier nur "/".
          server-dir: /

      # Bing und die anderen IndexNow-Suchmaschinen sofort ueber geaenderte
      # Seiten informieren (ENT-025). Die Websuche von ChatGPT und Copilot baut
      # auf Bing auf. Scheitert die Meldung, bleibt die Seite trotzdem live.
      - name: Geaenderte Seiten an IndexNow melden
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          VORHER: ${{ github.event.before }}
        run: python3 quellen/indexnow.py "$VORHER"
